<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="t">Large task: no kit vs release 1.9.1</title>
<desc id="d">Claude Code and Codex each ran the same large task without the kit twice, labeled R1 and R2, and with release 1.9.1 once, labeled R1. Each row is an individual run, not an average. Bars show wall time on one shared zero to thirty minute scale and labels show minutes and seconds. Costs use native units: Claude cold USD estimate includes Sol reviewer spend, while Codex uses OpenAI credits. Outcome labels report hidden T1 through T4 cases passed out of four; CI passed for all runs. Source: evaluation/evidence/2026-11-27-release-1-9-1 spend.json, prev-metrics-2026-11-27-codex-consumption-144110.json, and metrics.json.</desc>
