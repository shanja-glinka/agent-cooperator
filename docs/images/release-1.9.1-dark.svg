<title id="t">Large task: released baselines, default, and explicit research</title>
<desc id="d">The same large task, with each run listed separately. The chart compares no-kit and release 1.8.1 baselines, the default 1.9.1 route, and two explicit GPT-6.2 Sol author plus reviewer research runs. Bars share a zero-to-forty-minute scale; cost stays in native units, Claude cold USD estimate and Codex standard credits. The status column shows hidden T1 through T4 cases passed out of four; CI passed for all runs. The explicit research pair was clean-isolated. Both 1.8.1 Codex runs shared a temporary hook path, and no-kit Codex R1 shared /tmp with another run. Source: 2026-11-27 release spend.json, metrics.json and isolation.json; codex-owner-review-200323 CREDITS.md, metrics.json and isolation.json. Claude Code · Opus 5.5: No kit · R1, 18:20, $4.90, 2 of 4 hidden T1–T4 cases, isolation clean; No kit · R2, 14:49, $4.17, 3 of 4 hidden T1–T4 cases, isolation clean; 1.8.1 · R1, 36:59, $5.03, 4 of 4 hidden T1–T4 cases, isolation clean; 1.8.1 · R2, 25:09, $2.81, 4 of 4 hidden T1–T4 cases, isolation clean; 1.9.1 default · R1, 29:27, $3.95, 4 of 4 hidden T1–T4 cases, isolation clean. Codex · GPT-6.2 Sol: No kit · R1*, 08:44, 19.76, 4 of 4 hidden T1–T4 cases, isolation shared; No kit · R2, 09:09, 21.65, 4 of 4 hidden T1–T4 cases, isolation clean; 1.8.1 · R1†, 28:44, 42.57, 4 of 4 hidden T1–T4 cases, isolation shared; 1.8.1 · R2†, 28:30, 43.58, 4 of 4 hidden T1–T4 cases, isolation shared; Explicit research · R1, 13:20, 36.51, 4 of 4 hidden T1–T4 cases, isolation clean; Explicit research · R2, 12:55, 36.80, 4 of 4 hidden T1–T4 cases, isolation clean; 1.9.1 default · R1, 16:45, 52.25, 4 of 4 hidden T1–T4 cases, isolation clean</desc>
